name: Testen en publiceren

on:
  push:
    branches: [main]
  workflow_dispatch:

# Publiceren gebeurt rechtstreeks vanuit deze workflow. Er wordt dus geen
# aparte gh-pages-branch aangemaakt; alles blijft op main.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  testen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Tests draaien
        run: npm test

  publiceren:
    needs: testen
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publiceren.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # enablement zet de Pages-bron op "GitHub Actions". Zonder dat draait
      # GitHub daarnaast nog een Jekyll-build van de repo-root, en die zou deze
      # publicatie overschrijven.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Versie stempelen
        run: |
          KORT="${GITHUB_SHA::7}"
          NU="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          printf '{\n  "versie": "%s",\n  "commit": "%s",\n  "datum": "%s"\n}\n' \
            "$KORT" "$GITHUB_SHA" "$NU" > app/versie.json
          # Ook de cachenaam van de service worker, anders blijft de oude app staan.
          sed -i "s/const VERSIE = '[^']*'/const VERSIE = 'schoonmaak-$KORT'/" app/sw.js
          grep -n "const VERSIE" app/sw.js
          cat app/versie.json

      - name: App klaarzetten
        uses: actions/upload-pages-artifact@v3
        with:
          path: app
      - id: publiceren
        uses: actions/deploy-pages@v4
